name: CI

# Public CI for the reliage engine (software-correctness gate).
# Runs ONLY the dependency-light Python core: numpy/pandas/scipy unit tests + the
# reliage self-check. It deliberately does NOT run scoring (methylCIPHER/pyaging),
# data download, or the full pipeline — those need R, a 9.7 GB GEO download, and an
# isolated pyaging env, and are covered by the reproduction package, not CI.

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    name: pytest + selfcheck (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install reliage + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Self-check gates (ICC vs Shrout-Fleiss, variance-ratio recovery, detectability)
        run: python -m reliage.selfcheck

      - name: Run test suite
        run: pytest -q
